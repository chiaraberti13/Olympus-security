name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: ruff · pytest (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for secret scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  package-smoke:
    name: wheel · clean-install · CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/olympus-wheel-smoke
          /tmp/olympus-wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed CLI surfaces
        run: |
          OLYMPUS=/tmp/olympus-wheel-smoke/bin/olympus
          "$OLYMPUS" --help
          "$OLYMPUS" version
          for module in core argus athena helios artemis proteus hermes apollo minerva vulcan metis aegis; do
            "$OLYMPUS" "$module" --help
          done

  secret-scan:
    name: gitleaks (blocking working-tree + history scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan checked-out files
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact --exit-code=1
      - name: Scan complete Git history
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code=1
