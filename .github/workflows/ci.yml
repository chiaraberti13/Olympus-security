name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: ruff · pytest (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  secret-scan:
    # Advisory secret scan (non-blocking). Committing secrets remains a project
    # rule, but this analysis never blocks a build or merge — it only reports.
    name: gitleaks (secret scan, advisory)
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR's commits via the GitHub API; without these
    # scopes the default token gets a 403 ("Resource not accessible by
    # integration") and the job fails before scanning anything.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
