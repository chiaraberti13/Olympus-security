# Mars range target: deliberately weak configuration (missing security
# headers, permissive CORS) so Artemis has something real to find.
# Synthetic content only ("Olympus Demo Corp"). Non-destructive: this is
# a static site, no application logic, no real data.
server {
    listen 80;
    server_name olympusdemocorp.example localhost;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "true" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
