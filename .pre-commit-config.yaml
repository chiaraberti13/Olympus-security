repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: hermes-secret-scan
        name: Hermes secret scan (dogfood)
        description: Olympus's own Hermes module, scanning its own staged files.
        entry: olympus hermes scan
        language: system
        pass_filenames: true
        types: [text]
        # Test fixtures and demo samples intentionally contain fake secrets.
        exclude: ^(tests/|examples/input/hermes-samples/|examples/output/)
