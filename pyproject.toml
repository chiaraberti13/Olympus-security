[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympus-security"
version = "1.0.0"
description = "Olympus — an offensive-security platform (Red + Blue) with a shared data contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olympus Security" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "dnspython>=2.6",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "build>=1.2",
]

[project.scripts]
olympus = "olympus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olympus"]

# ---------------------------------------------------------------------------
# Quality gates
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PTH", "RUF"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
# asserts + fake secrets used as Hermes test fixtures + fixed-argv,
# no-shell subprocess calls (git/docker) used across the test suite.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
# Fixed-argv `git` subprocess calls (PATH-resolved, no shell, no untrusted input).
"src/olympus/hermes/git_history.py" = ["S603", "S607"]
"src/olympus/hermes/cli.py" = ["S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["olympus"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-q --cov=olympus --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["olympus"]
