rule_id: APOLLO-METABASE-RESET-PW-SQLI-001
name: Metabase reset-password SQL injection attempt
description: >-
  Flags an exploitation attempt against the unauthenticated Metabase
  /api/session/reset_password endpoint (CVE-2026-72898): a POST to that path
  whose body carries a UNION-based SQL injection payload. Detection only — it
  matches attacker telemetry, it does not itself send any payload.
event_type: network
mitre_technique_id: T1190
severity: critical
conditions:
  - field: http_path
    equals: /api/session/reset_password
  - field: http_body
    contains: UNION SELECT
